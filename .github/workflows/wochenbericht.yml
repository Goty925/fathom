# Läuft jeden Montagmorgen automatisch auf den Servern von GitHub (kostenlos).
# Manuell starten: Reiter "Actions" → "Wochenbericht" → "Run workflow" (nur auf dem Standard-Branch wirksam).
# Das ist PRODUCTION: E-Mail, Historie in data/, öffentliche Website. Probeläufe gehören in staging.yml.
name: Wochenbericht

on:
  schedule:
    # Montag 05:17 UTC = 07:17 Uhr (Winterzeit) bzw. 06:17 Uhr (Sommerzeit) in Deutschland.
    # Krumme Minute, weil GitHub zur vollen Stunde oft überlastet ist.
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Sicherheit: standardmäßig keine Rechte; jeder Job bekommt nur, was er braucht (unten).
# Actions sind auf feste Commits gepinnt (der Kommentar nennt die Version), damit ein gekaperter Tag nichts einschleusen
# kann. Dependabot (.github/dependabot.yml) schlägt Updates als Pull Request vor.
permissions: {}

concurrency:
  group: wochenbericht
  cancel-in-progress: false

jobs:
  bericht:
    # Nur auf dem Standard-Branch (main): Ein „Run workflow“ auf einem anderen Branch würde sonst die echte E-Mail
    # verschicken, in diesen Branch committen und die Live-Website aus ihm veröffentlichen.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # Historie und Archiv zurück ins Repository schreiben
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # Token nicht in .git ablegen, wo jedes Python-Paket es lesen könnte

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Bibliotheken installieren
        # Festgeschriebene Versionen mit Prüfsummen: ein neues oder manipuliertes Paket wird abgelehnt
        run: pip install --require-hashes -r requirements.lock

      - name: Tests
        run: python -m pytest -q

      # Kurs- und Wirtschaftsdaten für den Backtest (OANDA, FRED) zwischen den Läufen aufheben:
      # abgeschlossene Zeiträume werden nie neu geladen, und ein Ausfall der Quelle leert den Backtest nicht.
      - name: Backtest-Daten aus dem Cache holen
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: cache
          key: backtest-${{ github.run_id }}
          restore-keys: backtest-

      - name: Bericht erzeugen und per E-Mail senden
        env:
          FATHOM_UMGEBUNG: production
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORT: ${{ secrets.SMTP_PASSWORT }}
          EULERPOOL_API_KEY: ${{ secrets.EULERPOOL_API_KEY }}   # Hauptdatenquelle, ohne Schlüssel springt Yahoo ein
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}   # optional: zweite Quelle für Earnings-Erwartungen
          MAIL_AN: ${{ secrets.MAIL_AN }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}   # Backtest: exakte Geld-/Briefkurse (Minute, Stunde, Tag)
          OANDA_UMGEBUNG: ${{ vars.OANDA_UMGEBUNG }}        # practice (Standard) oder live
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}         # Backtest: CPI und Arbeitsmarkt wie am Tag der Veröffentlichung
          TRADINGECONOMICS_API_KEY: ${{ secrets.TRADINGECONOMICS_API_KEY }}   # optional: Prognosen (Konsens)
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}           # optional: Prognosen, falls kein Trading-Economics-Schlüssel
        run: python main.py

      - name: Historie und Archiv speichern
        env:
          GH_TOKEN: ${{ github.token }}   # nur in diesem Schritt, nach dem Lauf von Fremdcode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Wochenbericht $(date +%F)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

      - name: Website-Dateien bereitstellen
        if: vars.PAGES_AKTIV == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  website:
    needs: bericht
    if: vars.PAGES_AKTIV == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write      # Website veröffentlichen
      id-token: write   # Nachweis gegenüber GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}
    steps:
      - id: veroeffentlichen
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
